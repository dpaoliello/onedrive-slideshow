<html>

<head>
    <style>
        html {
          background-color: black;
          touch-action: none;
          user-select: none;
          -webkit-user-select: none;
        }
        img {
            object-fit: contain;
        }
        #caption {
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }
        #caption.show {
            opacity: 1;
        }
        #caption_text {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            margin: 0;
            padding: 12px 32px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 26px;
            line-height: 1.25;
            text-align: center;
            white-space: pre-wrap;
            box-sizing: border-box;
        }
        #caption_date {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            padding: 12px 32px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 22px;
            text-align: center;
            box-sizing: border-box;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }
        #caption_date:empty {
            display: none;
        }
    </style>
    <script>
        const HOLD_MS = 400;
        let holdTimer = null;
        let isHold = false;

        function toggleCaption() {
            isHold = true;
            const c = document.getElementById('caption');
            if (c) c.classList.toggle('show');
        }

        window.addEventListener('pointerdown', () => {
            isHold = false;
            clearTimeout(holdTimer);
            holdTimer = setTimeout(toggleCaption, HOLD_MS);
        });
        window.addEventListener('pointerup', () => {
            clearTimeout(holdTimer);
            if (!isHold) {
                window.ipc.postMessage('onClick');
            }
        });
        window.addEventListener('pointercancel', () => {
            clearTimeout(holdTimer);
        });
        window.addEventListener('contextmenu', (e) => e.preventDefault());
    </script>
</head>

<body>
    <img
        id="main_image"
        src="http://slideshow.localhost/IMAGE_SRC"
        height="100%"
        width="100%" />
    <div id="caption">
        <div id="caption_date">DATE_TEXT</div>
        <div id="caption_text">DESCRIPTION_TEXT</div>
    </div>
</body>

</html>
